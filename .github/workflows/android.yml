name: Build Android APK

on:
  push:
    paths:
      - 'gpay-listener/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Create local.properties for Secrets
      run: |
        echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> gpay-listener/local.properties
        echo "API_KEY=${{ secrets.API_KEY }}" >> gpay-listener/local.properties

    - name: Build APK with Gradle
      run: |
        cd gpay-listener
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GPayListener-APK
        path: gpay-listener/app/build/outputs/apk/debug/app-debug.apk
