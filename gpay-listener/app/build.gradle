plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.gpaylistener'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.gpaylistener"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        Properties properties = new Properties()
        if (project.rootProject.file("local.properties").exists()) {
            properties.load(project.rootProject.file("local.properties").newDataInputStream())
        }
        
        def backendUrl = properties.getProperty('BACKEND_URL')
        if (backendUrl == null || backendUrl.trim().isEmpty()) {
            backendUrl = "http://10.0.2.2:8000/finance/ingest"
        }
        
        def apiKey = properties.getProperty('API_KEY')
        if (apiKey == null || apiKey.trim().isEmpty()) {
            apiKey = "default_key"
        }

        buildConfigField "String", "BACKEND_URL", "\"${backendUrl}\""
        buildConfigField "String", "API_KEY", "\"${apiKey}\""
    }
    
    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.work:work-runtime-ktx:2.9.0")
}
